name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore FinGuard.slnx
      - run: dotnet build FinGuard.slnx --no-restore -c Release
      - run: dotnet test FinGuard.slnx --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: backend-test-results, path: TestResults }

  frontend:
    name: Frontend typecheck, unit tests & build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (desktop + mobile)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { global-json-file: global.json }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with: { name: playwright-report, path: web/playwright-report }

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { global-json-file: global.json }
      - run: dotnet restore FinGuard.slnx
      - run: dotnet list FinGuard.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt; ! grep -q -E "\b(High|Critical)\b" vuln.txt
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: cd web && npm ci && npm audit --audit-level=high --omit=dev && npm audit --audit-level=high
